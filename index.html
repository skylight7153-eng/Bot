<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pointercrate Style - Demon List</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* POINTERCRATE COLOR SCHEME */
        :root {
            --bg-body: #111317;
            --bg-card: #1b1d24;
            --bg-card-hover: #22252e;
            --border: #2c2f3a;
            --text-main: #e1e3e8;
            --text-muted: #8c92a4;
            --accent-gold: #ffd700;
            --accent-silver: #c0c0c0;
            --accent-bronze: #cd7f32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-title {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .logo-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 4px;
        }

        /* STATS BAR */
        .stats-bar {
            display: flex;
            gap: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 10px 25px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .stats-bar span {
            color: #fff;
            font-weight: 700;
        }

        /* SEARCH BAR */
        .search-container {
            width: 100%;
            max-width: 850px;
            margin-bottom: 20px;
        }

        .search-container input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .search-container input:focus {
            border-color: #555c6e;
        }

        /* DEMON LIST CONTAINER */
        .demon-list {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* CARD STYLE (POINTERCRATE LOOK) */
        .demon-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            transition: background 0.2s, border-color 0.2s;
        }

        .demon-card:hover {
            background: var(--bg-card-hover);
            border-color: #414656;
        }

        .rank {
            background: #14161c;
            color: #fff;
            font-size: 1.8rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 75px;
            border-right: 1px solid var(--border);
        }

        .demon-card:nth-child(1) .rank { color: var(--accent-gold); }
        .demon-card:nth-child(2) .rank { color: var(--accent-silver); }
        .demon-card:nth-child(3) .rank { color: var(--accent-bronze); }

        .details {
            padding: 18px 22px;
            flex-grow: 1;
        }

        .details-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .details h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
        }

        .details p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 3px 0;
        }

        .details p span {
            color: var(--text-main);
            font-weight: 500;
        }

        /* DEMON RATING BADGES */
        .rating-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .rating-extreme { background: rgba(235, 59, 90, 0.2); color: #eb3b5a; border: 1px solid #eb3b5a; }
        .rating-insane { background: rgba(165, 94, 234, 0.2); color: #a55eea; border: 1px solid #a55eea; }
        .rating-hard { background: rgba(250, 130, 49, 0.2); color: #fa8231; border: 1px solid #fa8231; }
        .rating-medium { background: rgba(254, 211, 48, 0.2); color: #fed330; border: 1px solid #fed330; }
        .rating-easy { background: rgba(32, 191, 107, 0.2); color: #20bf6b; border: 1px solid #20bf6b; }
        .rating-default { background: rgba(255, 255, 255, 0.1); color: #ccc; border: 1px solid #ccc; }

        .video-container {
            width: 260px;
            flex-shrink: 0;
            background: #000;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 768px) {
            .demon-card { flex-direction: column; }
            .rank { width: 100%; padding: 8px; border-right: none; border-bottom: 1px solid var(--border); }
            .video-container { width: 100%; height: 180px; }
        }
    </style>
</head>
<body>

    <header>
        <h1 class="logo-title">DEMON LIST</h1>
        <p class="logo-subtitle">Accurate Dash Official Leaderboard</p>
    </header>

    <div class="stats-bar">
        <div>Total Demons: <span id="totalDemons">0</span></div>
        <div>•</div>
        <div>Top Demon: <span id="topDemon">None</span></div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="filterDemons()" placeholder="Search level, creator or verifier...">
    </div>

    <div class="demon-list" id="demonList">
        <p style="text-align: center; color: var(--text-muted);">Loading demons...</p>
    </div>

    <script>
        function formatYouTubeUrl(url) {
            if (!url) return '';
            if (url.includes('youtube.com/embed/')) return url;
            let videoId = '';
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            } else if (url.includes('youtube.com/watch?v=')) {
                videoId = url.split('v=')[1].split('&')[0];
            } else {
                videoId = url;
            }
            return `https://www.youtube.com/embed/${videoId}`;
        }

        // Dopasowanie koloru plakietki trudności
        function getRatingClass(rating) {
            if (!rating) return 'rating-default';
            const r = rating.toLowerCase();
            if (r.includes('extreme')) return 'rating-extreme';
            if (r.includes('insane')) return 'rating-insane';
            if (r.includes('hard')) return 'rating-hard';
            if (r.includes('medium')) return 'rating-medium';
            if (r.includes('easy')) return 'rating-easy';
            return 'rating-default';
        }

        function wczytajDemony() {
            fetch('dane.json')
                .then(res => res.json())
                .then(dane => {
                    const demonList = document.getElementById('demonList');
                    document.getElementById('totalDemons').innerText = dane.length;
                    document.getElementById('topDemon').innerText = dane.length > 0 ? dane[0].nazwa : 'None';

                    if (dane.length === 0) {
                        demonList.innerHTML = '<p style="text-align: center; color: var(--text-muted);">List is empty.</p>';
                        return;
                    }

                    demonList.innerHTML = '';

                    dane.forEach((item, index) => {
                        const card = document.createElement('div');
                        card.className = 'demon-card';
                        
                        const embedUrl = formatYouTubeUrl(item.video);
                        const ratingClass = getRatingClass(item.rating);

                        card.innerHTML = `
                            <div class="rank">#${index + 1}</div>
                            <div class="details">
                                <div class="details-header">
                                    <h2>${item.nazwa}</h2>
                                    <span class="rating-badge ${ratingClass}">${item.rating || 'Demon'}</span>
                                </div>
                                <p>Created by <span>${item.creator || 'Unknown'}</span></p>
                                <p>Verified by <span>${item.verifier || 'Unknown'}</span></p>
                                <p>Points: <span>${item.points || '0.00'}</span> | Level ID: <span>${item.level_id || 'N/A'}</span></p>
                            </div>
                            <div class="video-container">
                                <iframe src="${embedUrl}" allowfullscreen></iframe>
                            </div>
                        `;
                        demonList.appendChild(card);
                    });
                })
                .catch(err => {
                    document.getElementById('demonList').innerHTML = '<p style="text-align: center; color: var(--text-muted);">Failed to load dane.json</p>';
                });
        }

        function filterDemons() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.getElementsByClassName('demon-card');

            for (let i = 0; i < cards.length; i++) {
                const text = cards[i].innerText.toLowerCase();
                cards[i].style.display = text.includes(input) ? "flex" : "none";
            }
        }

        wczytajDemony();
    </script>
</body>
</html>
