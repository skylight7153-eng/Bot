<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Accurate Dash</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #111317;
            --bg-card: #1b1d24;
            --border: #2c2f3a;
            --text-main: #e1e3e8;
            --text-muted: #8c92a4;
            --accent-green: #20bf6b;
            --accent-red: #eb3b5a;
            --accent-blue: #4b7bec;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* LOGIN SCREEN */
        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 8px;
            max-width: 400px;
            margin: 100px auto 0 auto;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #14161c;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            margin-bottom: 12px;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #555c6e;
        }

        button {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        .btn-green { background: var(--accent-green); color: #fff; }
        .btn-blue { background: var(--accent-blue); color: #fff; }
        .btn-red { background: var(--accent-red); color: #fff; }
        .btn-gray { background: #3a3f50; color: #fff; }

        /* DASHBOARD */
        .dashboard {
            display: none;
            flex-direction: column;
            gap: 25px;
        }

        .panel-block {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 8px;
        }

        .panel-block h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-grid .full-width {
            grid-column: span 2;
        }

        /* LEVEL ITEM LIST */
        .level-item {
            background: #14161c;
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .level-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .level-pos {
            font-weight: 900;
            color: #8c92a4;
            min-width: 35px;
        }

        .level-actions {
            display: flex;
            gap: 8px;
        }

        .level-actions button {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        textarea.json-output {
            height: 150px;
            font-family: monospace;
            font-size: 0.85rem;
            resize: vertical;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- EKRAN LOGOWANIA -->
        <div class="login-box" id="loginBox">
            <h2>Admin Panel Login</h2>
            <input type="password" id="passwordInput" placeholder="Wpisz hasło administratora...">
            <button class="btn-green" style="width: 100%;" onclick="checkPassword()">Zaloguj się</button>
            <p id="errorMsg" style="color: var(--accent-red); margin-top: 10px; font-size: 0.85rem; display: none;">Nieprawidłowe hasło!</p>
        </div>

        <!-- PANEL ZARZĄDZANIA -->
        <div class="dashboard" id="dashboard">
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Accurate Dash - Zarządzanie Demonami</h2>
                <button class="btn-gray" onclick="fetchCurrentData()">Odśwież z dane.json</button>
            </div>

            <!-- FORMULARZ DODAWANIA POZIOMU -->
            <div class="panel-block">
                <h3>Dodaj Nowy Poziom</h3>
                <div class="form-grid">
                    <input type="text" id="addNazwa" placeholder="Nazwa Poziomu (np. Acheron)">
                    <input type="text" id="addCreator" placeholder="Twórca (Creator)">
                    <input type="text" id="addVerifier" placeholder="Weryfikator (Verifier)">
                    <input type="text" id="addPoints" placeholder="Punkty (np. 100.00)">
                    <input type="text" id="addLevelId" placeholder="ID Poziomu (np. #123456)">
                    
                    <select id="addRating">
                        <option value="Extreme Demon">Extreme Demon</option>
                        <option value="Insane Demon">Insane Demon</option>
                        <option value="Hard Demon">Hard Demon</option>
                        <option value="Medium Demon">Medium Demon</option>
                        <option value="Easy Demon">Easy Demon</option>
                    </select>

                    <input type="text" id="addVideo" class="full-width" placeholder="Link do YouTube (np. https://www.youtube.com/watch?v=...)">
                </div>
                <button class="btn-green" style="margin-top: 10px; width: 100%;" onclick="addDemon()">Dodaj Demon do Listy</button>
            </div>

            <!-- ZARZĄDZANIE POZYCJAMI -->
            <div class="panel-block">
                <h3>Kolejność i Pozycje (#1, #2, #3...)</h3>
                <div id="levelsContainer">
                    <p style="color: var(--text-muted);">Ładowanie poziomów...</p>
                </div>
            </div>

            <!-- EKSPORT KODU JSON -->
            <div class="panel-block">
                <h3>Gotowy Kod JSON (Dla GitHuba)</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 10px;">Skopiuj poniższy kod i wklej go bezpośrednio do pliku <code>dane.json</code> w serwisie GitHub.</p>
                <textarea id="jsonOutput" class="json-output" readonly></textarea>
                <button class="btn-blue" style="width: 100%; margin-top: 10px;" onclick="copyJSON()">Kopiuj Kod JSON do Schowka</button>
            </div>

        </div>

    </div>

    <script>
        const CORRECT_PASS = "AccurateDashSigmaTiki12";
        let demonData = [];

        function checkPassword() {
            const pass = document.getElementById('passwordInput').value;
            if (pass === CORRECT_PASS) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboard').style.display = 'flex';
                fetchCurrentData();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function fetchCurrentData() {
            fetch('dane.json')
                .then(res => res.json())
                .then(data => {
                    demonData = data;
                    renderLevels();
                })
                .catch(() => {
                    demonData = [];
                    renderLevels();
                });
        }

        function renderLevels() {
            const container = document.getElementById('levelsContainer');
            container.innerHTML = '';

            if (demonData.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">Brak poziomów na liście.</p>';
                updateJSONOutput();
                return;
            }

            demonData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'level-item';
                div.innerHTML = `
                    <div class="level-info">
                        <span class="level-pos">#${index + 1}</span>
                        <div>
                            <strong>${item.nazwa}</strong> (${item.rating || 'Demon'})
                            <div style="font-size: 0.8rem; color: var(--text-muted);">By ${item.creator || 'N/A'} | Verified: ${item.verifier || 'N/A'}</div>
                        </div>
                    </div>
                    <div class="level-actions">
                        <button class="btn-gray" onclick="moveLevel(${index}, -1)" ${index === 0 ? 'disabled style="opacity:0.3"' : ''}>▲ Góra</button>
                        <button class="btn-gray" onclick="moveLevel(${index}, 1)" ${index === demonData.length - 1 ? 'disabled style="opacity:0.3"' : ''}>▼ Dół</button>
                        <button class="btn-red" onclick="deleteLevel(${index})">Usuń</button>
                    </div>
                `;
                container.appendChild(div);
            });

            updateJSONOutput();
        }

        function addDemon() {
            const nazwa = document.getElementById('addNazwa').value.trim();
            const creator = document.getElementById('addCreator').value.trim();
            const verifier = document.getElementById('addVerifier').value.trim();
            const points = document.getElementById('addPoints').value.trim();
            const level_id = document.getElementById('addLevelId').value.trim();
            const rating = document.getElementById('addRating').value;
            const video = document.getElementById('addVideo').value.trim();

            if (!nazwa) {
                alert("Wpisz przynajmniej nazwę poziomu!");
                return;
            }

            const newDemon = {
                nazwa: nazwa,
                creator: creator || "Unknown",
                verifier: verifier || "Unknown",
                points: points || "0.00",
                level_id: level_id || "#000000",
                rating: rating,
                video: video || ""
            };

            demonData.push(newDemon);
            
            // Czyszczenie pól
            document.getElementById('addNazwa').value = '';
            document.getElementById('addCreator').value = '';
            document.getElementById('addVerifier').value = '';
            document.getElementById('addPoints').value = '';
            document.getElementById('addLevelId').value = '';
            document.getElementById('addVideo').value = '';

            renderLevels();
        }

        function moveLevel(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= demonData.length) return;

            const temp = demonData[index];
            demonData[index] = demonData[newIndex];
            demonData[newIndex] = temp;

            renderLevels();
        }

        function deleteLevel(index) {
            if (confirm(`Czy na pewno chcesz usunąć "${demonData[index].nazwa}"?`)) {
                demonData.splice(index, 1);
                renderLevels();
            }
        }

        function updateJSONOutput() {
            document.getElementById('jsonOutput').value = JSON.stringify(demonData, null, 2);
        }

        function copyJSON() {
            const textarea = document.getElementById('jsonOutput');
            textarea.select();
            document.execCommand('copy');
            alert("Kod JSON został skopiowany do schowka! Wklej go do pliku dane.json na GitHubie.");
        }
    </script>
</body>
</html>
